# Policy cold-start experiment. Offline pretraining has its own AdamW/epoch settings.
# Future self-play (only on explicit Resume): 8 games, 400 searches, publish every SGD update.
num_blocks: 19
num_filters: 128
input_channels: 131
num_simulations: 400
c_puct: 1.25
pb_c_base: 19652.0
dirichlet_alpha: 0.3
dirichlet_epsilon: 0.25
search_noise_depth: 3
num_sampling_moves: 30
reuse_tree: false
mcts_batch_size: 1
virtual_loss: 0.0
min_replay_games: 1
max_game_ply: 180
batch_size: 256
new_positions_per_update: 256
loss_reduction: mean
learning_rate: 0.002
lr_momentum: 0.9
lr_milestones:
- 100000
- 300000
- 500000
lr_decay_rate: 0.1
weight_decay: 0.0001
checkpoint_interval: 1
recovery_interval: 100
max_optimizer_steps: 700000
replay_window_games: 1000000
replay_window_positions: 50000
mirror_augmentation: true
replay_cache_mb: 256
num_workers: 8
inference_batch_size: 128
inference_wait_ms: 2.0
checkpoint_dir: /mnt/d/project/Alphazero-data/policy-tactics/run
max_iterations: 700000
seed: 20261015
precision: bf16
channels_last: true
compile_model: false
inference_cuda_graph: true
device: cuda
torch_threads: 1
telemetry_host: 127.0.0.1
telemetry_port: 8768
telemetry_interval: 0.25
actor_processes: 8
