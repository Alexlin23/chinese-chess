# AlphaZero 训练配置
# 参考 DeepMind AlphaZero 规模

# ── 模型架构 ──
model:
  blocks: 4               # 单卡起始配置，待实测调整
  filters: 64
  input_channels: 18      # 输入通道数 (固定)

# ── MCTS 搜索 ──
mcts:
  simulations: 64
  c_puct: 1.5             # PUCT探索系数
  dirichlet_alpha: 0.3    # Dirichlet噪声浓度
  dirichlet_epsilon: 0.25 # 噪声混合比例
  batch_size: 16
  virtual_loss: 3.0       # 虚拟损失，防止batch内重复选路径

# ── 自我对弈 ──
self_play:
  games: 100
  max_ply: 512            # 单局最大步数
  temperature_ply: 30     # 前N步用τ=1

# ── 训练 ──
training:
  batch_size: 64
  grad_accum_steps: 1
  lr: 0.02
  lr_momentum: 0.9        # SGD动量
  weight_decay: 0.0001    # L2正则
  epochs: 10              # 每轮训练epoch数
  replay_buffer: 100000
  replay_buffer_max_bytes: 536870912
  samples_per_epoch: 10000
  capture_reward: 0.3     # 吃子奖励（远小于赢棋的1.0）
  non_terminal_base_weight: 1.0    # 非终局位置基础权重（冷启动期和棋是主要信号）
  terminal_weight: 2.0    # 终局位置权重

# ── 冷启动 ──
warmup:
  win_rate_threshold: 0.6    # 对启发式胜率阈值
  eval_games: 20             # 每轮评估局数
  max_iterations: 50         # 最多用启发式训练轮数

# ── Arena 评估 ──
arena:
  games: 400              # 评估对局数 (AlphaZero原版400)
  threshold: 0.55         # 晋升胜率阈值

# ── 并行 ──
parallel:
  workers: 4
  inference_batch: 32
  inference_wait_ms: 10   # 最大等待时间(ms)

# ── 系统 ──
system:
  checkpoint_dir: "AlphaZero/checkpoints"
  log_interval: 100
  save_interval: 1
  monitor_interval: 5      # 监控刷新间隔(秒)

# ── 训练循环 ──
pipeline:
  mode: self              # 纯自博弈；启发式辅助实验需显式改为 heuristic
  max_iterations: 100     # 总迭代次数

